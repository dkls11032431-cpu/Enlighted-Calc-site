name: Website quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "redesign/**"

permissions:
  contents: read

jobs:
  quality-check:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML links, metadata, JavaScript and site files
        run: node .github/scripts/check-site.mjs
